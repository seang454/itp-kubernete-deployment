# ==============================================================================
# ITP Deployment - Main Umbrella Helm Chart
# Central configuration to control all services:
# 1. Oracle 19c Enterprise Database
# 2. ITP PostgreSQL (Microservices DB & IAM DB)
# 3. Event-Driven Infrastructure (Kafka KRaft cluster, Schema Registry, Debezium, Kafka UI)
# 4. HashiCorp Vault Server
# 5. Redis Cache / Datastore
#
# Resources are minimized and optimized for resource-constrained clusters.
# ==============================================================================

global: {}

# ------------------------------------------------------------------------------
# 1. Oracle 19c Database
# ------------------------------------------------------------------------------
oracle19c:
  enabled: true
  replicaCount: 1
  image:
    repository: container-registry.oracle.com/database/enterprise
    tag: "19.3.0.0"
    pullPolicy: IfNotPresent
    pullSecrets:
      - name: oracle-registry-secret
    # Set create: true and enter username/password if you want Helm to create the secret automatically
    pullSecret:
      create: false
      name: "oracle-registry-secret"
      server: "container-registry.oracle.com"
      username: ""
      password: ""
      email: ""
  fullnameOverride: "oracle-itp"
  service:
    type: ClusterIP
    port: 1521
  oracle:
    pwd: "Oracle@168"
    enableArchiveLog: "true"
    initSgaSize: "1024"
    initPgaSize: "512"
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: 15Gi
  resources:
    limits:
      cpu: 1000m
      memory: 4096Mi
    requests:
      cpu: 100m
      memory: 2048Mi
  podSecurityContext:
    fsGroup: 54321
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
  tolerations: []

# ------------------------------------------------------------------------------
# 2. PostgreSQL Databases (Microservices & IAM)
# ------------------------------------------------------------------------------
itp-postgres:
  enabled: false
  image:
    repository: postgres
    tag: "17.5-bullseye"
    pullPolicy: IfNotPresent
  microDb:
    enabled: true
    name: pg-itp-micro-db
    replicaCount: 1
    auth:
      user: itpusr
      password: "itp@168"
    service:
      type: ClusterIP
      port: 5432
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: 2Gi
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 25m
        memory: 128Mi
  iamDb:
    enabled: true
    name: pg-itp-iam-db
    replicaCount: 1
    auth:
      user: itpusr
      password: "itp@168"
    service:
      type: ClusterIP
      port: 5432
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: 2Gi
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 25m
        memory: 128Mi
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
  tolerations: []

# ------------------------------------------------------------------------------
# 3. Event-Driven Infrastructure (Kafka KRaft, Schema Registry, Debezium, Kafka UI)
# ------------------------------------------------------------------------------
event-driven-infra:
  enabled: false
  clusterDomain: "k8scluster"
  clusterId: "4L6g3nShT-eMCtK--X86sw"
  kafka:
    image:
      repository: confluentinc/cp-kafka
      tag: "7.8.0"
      pullPolicy: IfNotPresent
    jvmOpts: "-Xms192m -Xmx384m"
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: 2Gi
    resources:
      limits:
        cpu: 500m
        memory: 1024Mi
      requests:
        cpu: 50m
        memory: 384Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
          - weight: 80
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    tolerations: []
  schemaRegistry:
    enabled: true
    name: schema-registry-itp
    image:
      repository: confluentinc/cp-schema-registry
      tag: "7.8.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8081
    jvmOpts: "-Xms128m -Xmx256m"
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: 1Gi
    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 25m
        memory: 256Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
          - weight: 80
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    tolerations: []
  debezium:
    enabled: false
    name: debezium-kafka-connect-itp
    image:
      repository: quay.io/debezium/connect
      tag: "3.4.0.Final"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8083
    jvmOpts: "-Xms256m -Xmx1024m"
    persistence:
      enabled: true
      storageClassName: "longhorn"
      pluginsSize: 2Gi
      dataSize: 1Gi
    resources:
      limits:
        cpu: 500m
        memory: 2048Mi
      requests:
        cpu: 10m
        memory: 512Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
          - weight: 80
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    tolerations: []
  kafkaUi:
    enabled: false
    name: kafka-ui-itp
    image:
      repository: provectuslabs/kafka-ui
      tag: "latest"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 8080
    auth:
      type: "LOGIN_FORM"
      username: "admin"
      password: "qwer"
    jvmOpts: "-Xms64m -Xmx256m"
    persistence:
      enabled: true
      storageClassName: "longhorn"
      size: 1Gi
    resources:
      limits:
        cpu: 250m
        memory: 384Mi
      requests:
        cpu: 10m
        memory: 128Mi
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
          - weight: 80
            preference:
              matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values:
                    - amd64
    tolerations: []

# ------------------------------------------------------------------------------
# 4. HashiCorp Vault Server
# ------------------------------------------------------------------------------
vault-server:
  enabled: false
  replicaCount: 1
  image:
    repository: hashicorp/vault
    tag: "latest"
    pullPolicy: IfNotPresent
  fullnameOverride: "vault-itp"
  service:
    type: ClusterIP
    port: 8200
  vault:
    devRootTokenId: "myroot"
    devListenAddress: "0.0.0.0:8200"
  secrets:
    STRONG_PASSWORD: "Qwer@123"
    WEAK_PASSWORD: "qwer"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
  tolerations: []

# ------------------------------------------------------------------------------
# 5. Redis Cache
# ------------------------------------------------------------------------------
redis:
  enabled: false
  replicaCount: 1
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  fullnameOverride: "itp-redis"
  service:
    type: ClusterIP
    port: 6379
  auth:
    enabled: true
    password: "qwer"
  persistence:
    enabled: true
    storageClassName: "longhorn"
    size: 1Gi
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  nodeSelector:
    kubernetes.io/arch: amd64
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
        - weight: 80
          preference:
            matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
  tolerations: []
