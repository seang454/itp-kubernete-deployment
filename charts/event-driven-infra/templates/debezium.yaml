{{- if .Values.debezium.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.debezium.name }}
  labels:
    {{- include "event-driven-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.debezium.name }}
spec:
  type: {{ .Values.debezium.service.type }}
  ports:
    - name: http
      port: {{ .Values.debezium.service.port }}
      targetPort: 8083
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Values.debezium.name }}
---
{{- if .Values.debezium.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debezium-plugins-itp
  labels:
    {{- include "event-driven-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.debezium.name }}
spec:
  accessModes: [ {{ .Values.debezium.persistence.accessMode | quote }} ]
  {{- if .Values.debezium.persistence.storageClassName }}
  storageClassName: {{ .Values.debezium.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.debezium.persistence.pluginsSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: debezium-data-itp
  labels:
    {{- include "event-driven-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.debezium.name }}
spec:
  accessModes: [ {{ .Values.debezium.persistence.accessMode | quote }} ]
  {{- if .Values.debezium.persistence.storageClassName }}
  storageClassName: {{ .Values.debezium.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.debezium.persistence.dataSize }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.debezium.name }}
  labels:
    {{- include "event-driven-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.debezium.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.debezium.name }}
  template:
    metadata:
      labels:
        {{- include "event-driven-infra.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.debezium.name }}
    spec:
      initContainers:
        - name: init-debezium-plugins
          image: "{{ .Values.debezium.image.repository }}:{{ .Values.debezium.image.tag }}"
          imagePullPolicy: {{ .Values.debezium.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              PLUGIN_DIR=/kafka/connect/plugins
              ORACLE_DIR=/opt/oracle

              mkdir -p $PLUGIN_DIR $ORACLE_DIR

              if [ ! -f $PLUGIN_DIR/kafka-connect-avro-converter.jar ]; then
                echo "Downloading Avro and Schema Registry JARs..."
                curl -sSL -o $PLUGIN_DIR/kafka-connect-avro-converter.jar https://packages.confluent.io/maven/io/confluent/kafka-connect-avro-converter/7.3.0/kafka-connect-avro-converter-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/kafka-connect-avro-data.jar https://packages.confluent.io/maven/io/confluent/kafka-connect-avro-data/7.3.0/kafka-connect-avro-data-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/kafka-avro-serializer.jar https://packages.confluent.io/maven/io/confluent/kafka-avro-serializer/7.3.0/kafka-avro-serializer-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/kafka-schema-serializer.jar https://packages.confluent.io/maven/io/confluent/kafka-schema-serializer/7.3.0/kafka-schema-serializer-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/kafka-schema-converter.jar https://packages.confluent.io/maven/io/confluent/kafka-schema-converter/7.3.0/kafka-schema-converter-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/kafka-schema-registry-client.jar https://packages.confluent.io/maven/io/confluent/kafka-schema-registry-client/7.3.0/kafka-schema-registry-client-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/common-config.jar https://packages.confluent.io/maven/io/confluent/common-config/7.3.0/common-config-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/common-utils.jar https://packages.confluent.io/maven/io/confluent/common-utils/7.3.0/common-utils-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/avro.jar https://repo1.maven.org/maven2/org/apache/avro/avro/1.10.2/avro-1.10.2.jar
                curl -sSL -o $PLUGIN_DIR/commons-compress.jar https://repo1.maven.org/maven2/org/apache/commons/commons-compress/1.21/commons-compress-1.21.jar
                curl -sSL -o $PLUGIN_DIR/failureaccess.jar https://repo1.maven.org/maven2/com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar
                curl -sSL -o $PLUGIN_DIR/guava.jar https://repo1.maven.org/maven2/com/google/guava/guava/31.1-jre/guava-31.1-jre.jar
                curl -sSL -o $PLUGIN_DIR/minimal-json.jar https://repo1.maven.org/maven2/com/eclipsesource/minimal-json/minimal-json/0.9.5/minimal-json-0.9.5.jar
                curl -sSL -o $PLUGIN_DIR/re2j.jar https://repo1.maven.org/maven2/com/google/re2j/re2j/1.3/re2j-1.3.jar
                curl -sSL -o $PLUGIN_DIR/slf4j-api.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/1.7.32/slf4j-api-1.7.32.jar
                curl -sSL -o $PLUGIN_DIR/snakeyaml.jar https://repo1.maven.org/maven2/org/yaml/snakeyaml/1.30/snakeyaml-1.30.jar
                curl -sSL -o $PLUGIN_DIR/swagger-annotations.jar https://repo1.maven.org/maven2/io/swagger/swagger-annotations/1.6.4/swagger-annotations-1.6.4.jar
                curl -sSL -o $PLUGIN_DIR/jackson-databind.jar https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-databind/2.13.3/jackson-databind-2.13.3.jar
                curl -sSL -o $PLUGIN_DIR/jackson-core.jar https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-core/2.13.3/jackson-core-2.13.3.jar
                curl -sSL -o $PLUGIN_DIR/jackson-annotations.jar https://repo1.maven.org/maven2/com/fasterxml/jackson/core/jackson-annotations/2.13.3/jackson-annotations-2.13.3.jar
                curl -sSL -o $PLUGIN_DIR/jackson-dataformat-csv.jar https://repo1.maven.org/maven2/com/fasterxml/jackson/dataformat/jackson-dataformat-csv/2.13.3/jackson-dataformat-csv-2.13.3.jar
                curl -sSL -o $PLUGIN_DIR/logredactor.jar https://repo1.maven.org/maven2/io/confluent/logredactor/7.3.0/logredactor-7.3.0.jar
                curl -sSL -o $PLUGIN_DIR/logredactor-metrics.jar https://repo1.maven.org/maven2/io/confluent/logredactor-metrics/7.3.0/logredactor-metrics-7.3.0.jar
              fi

              if [ ! -d $ORACLE_DIR/instantclient_19_28 ]; then
                echo "Downloading Oracle Instant Client 19c..."
                cd /tmp
                curl -sSL -o instantclient-basic.zip https://download.oracle.com/otn_software/linux/instantclient/1928000/instantclient-basic-linux.x64-19.28.0.0.0dbru.zip
                curl -sSL -o instantclient-jdbc.zip https://download.oracle.com/otn_software/linux/instantclient/1928000/instantclient-jdbc-linux.x64-19.28.0.0.0dbru.zip
                curl -sSL -o instantclient-sqlplus.zip https://download.oracle.com/otn_software/linux/instantclient/1928000/instantclient-sqlplus-linux.x64-19.28.0.0.0dbru.zip

                unzip -qo instantclient-basic.zip -d $ORACLE_DIR
                unzip -qo instantclient-jdbc.zip -d $ORACLE_DIR
                unzip -qo instantclient-sqlplus.zip -d $ORACLE_DIR
                rm -f *.zip
              fi

              cp $ORACLE_DIR/instantclient_19_28/*.jar $PLUGIN_DIR/ || true
              chmod -R 777 $PLUGIN_DIR $ORACLE_DIR
              echo "Debezium plugins and Oracle client initialization complete."
          volumeMounts:
            - name: debezium-plugins
              mountPath: /kafka/connect/plugins
            - name: oracle-client
              mountPath: /opt/oracle
      containers:
        - name: debezium-kafka-connect
          image: "{{ .Values.debezium.image.repository }}:{{ .Values.debezium.image.tag }}"
          imagePullPolicy: {{ .Values.debezium.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: GROUP_ID
              value: {{ .Values.debezium.groupId | quote }}
            - name: BOOTSTRAP_SERVERS
              value: "kafka-1-itp:9090,kafka-2-itp:9090,kafka-3-itp:9090"
            - name: CONFIG_STORAGE_TOPIC
              value: {{ .Values.debezium.configStorageTopic | quote }}
            - name: OFFSET_STORAGE_TOPIC
              value: {{ .Values.debezium.offsetStorageTopic | quote }}
            - name: STATUS_STORAGE_TOPIC
              value: {{ .Values.debezium.statusStorageTopic | quote }}
            - name: KEY_CONVERTER
              value: {{ .Values.debezium.keyConverter | quote }}
            - name: VALUE_CONVERTER
              value: {{ .Values.debezium.valueConverter | quote }}
            - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry-itp:8081"
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: "http://schema-registry-itp:8081"
            - name: LD_LIBRARY_PATH
              value: "/opt/oracle/instantclient_19_28"
            - name: ORACLE_HOME
              value: "/opt/oracle/instantclient_19_28"
            {{- if .Values.debezium.jvmOpts }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.debezium.jvmOpts | quote }}
            {{- end }}
          volumeMounts:
            - name: debezium-plugins
              mountPath: /kafka/connect/plugins
            - name: oracle-client
              mountPath: /opt/oracle
            - name: debezium-data
              mountPath: /kafka/data
          resources:
            {{- toYaml .Values.debezium.resources | nindent 12 }}
      volumes:
        - name: debezium-plugins
          {{- if .Values.debezium.persistence.enabled }}
          persistentVolumeClaim:
            claimName: debezium-plugins-itp
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: oracle-client
          emptyDir: {}
        - name: debezium-data
          {{- if .Values.debezium.persistence.enabled }}
          persistentVolumeClaim:
            claimName: debezium-data-itp
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.debezium.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.debezium.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.debezium.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
