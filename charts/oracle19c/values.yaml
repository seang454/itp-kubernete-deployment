replicaCount: 1

image:
  repository: container-registry.oracle.com/database/enterprise
  tag: "19.3.0.0"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: oracle-registry-secret
  pullSecret:
    create: false
    name: "oracle-registry-secret"
    server: "container-registry.oracle.com"
    username: ""
    password: ""
    email: ""

nameOverride: ""
fullnameOverride: "oracle-itp"

serviceAccount:
  create: false
  name: ""

podSecurityContext:
  fsGroup: 54321

securityContext: {}

service:
  type: ClusterIP
  port: 1521
  nodePort: null

oracle:
  pwd: "Oracle@168"
  enableArchiveLog: "true"
  initSgaSize: "1024"
  initPgaSize: "512"

persistence:
  enabled: true
  storageClassName: "longhorn"
  accessMode: ReadWriteOnce
  size: 15Gi

resources:
  limits:
    cpu: 1000m
    memory: 4096Mi
  requests:
    cpu: 100m
    memory: 2048Mi

nodeSelector: {}
tolerations: []
affinity: {}
