apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "oracle19c.fullname" . }}
  labels:
    {{- include "oracle19c.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "oracle19c.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "oracle19c.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oracle19c.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: oracle-itp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: listener
              containerPort: 1521
              protocol: TCP
          env:
            - name: ORACLE_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "oracle19c.fullname" . }}-secret
                  key: ORACLE_PWD
            - name: ENABLE_ARCHIVELOG
              value: {{ .Values.oracle.enableArchiveLog | quote }}
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
            - name: init-scripts
              mountPath: /opt/oracle/scripts/startup
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: init-scripts
          configMap:
            name: {{ include "oracle19c.fullname" . }}-init-scripts
        {{- if not .Values.persistence.enabled }}
        - name: oracle-data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: oracle-data
      spec:
        accessModes: [ {{ .Values.persistence.accessMode | quote }} ]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
