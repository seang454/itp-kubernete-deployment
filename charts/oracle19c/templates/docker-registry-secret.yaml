{{- if and .Values.image.pullSecret.create .Values.image.pullSecret.username }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.image.pullSecret.name | default "oracle-registry-secret" }}
  labels:
    {{- include "oracle19c.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" (.Values.image.pullSecret.server | default "container-registry.oracle.com") .Values.image.pullSecret.username .Values.image.pullSecret.password (.Values.image.pullSecret.email | default .Values.image.pullSecret.username) (printf "%s:%s" .Values.image.pullSecret.username .Values.image.pullSecret.password | b64enc) | b64enc }}
{{- end }}
