apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" . }}-config
  labels:
    {{- include "redis.labels" . | nindent 4 }}
data:
  redis.conf: |-
{{- if .Values.redisConfig }}
{{ .Values.redisConfig | indent 4 }}
{{- else }}
{{ .Files.Get "redis.conf" | indent 4 }}
{{- end }}
